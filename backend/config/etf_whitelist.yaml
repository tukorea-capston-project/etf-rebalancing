# 투자 대상 ETF 화이트리스트
#
# 전략의 투자 대상은 이 목록 안의 ETF와 현금으로 한정한다.
# 종목코드는 반드시 따옴표로 감싼 6자리 문자열로 쓴다.
# 따옴표가 없으면 PyYAML이 앞자리 0을 8진수로 해석한다.
#
# 슬롯(자산군·지역·섹터)마다 etfs(종목 목록)를 둔다. 나누지 않는 계층은 null이다.
# 분류 기준은 docs/universe.md 슬롯 분류를 따른다.

