# 분배금 보정
#
# yfinance 분배금의 누락·오류를 고친다. DB를 직접 고치지 않고 이 파일로만 고친다.
# 수집할 때 yfinance 데이터 위에 이 파일을 덮어 적용한다. 형식은 docs/market-data.md의 '보정 파일'.
#
# - (종목코드, 분배락일)별 최종값을 적는다.
#   - amount를 적으면 그 값으로 추가하거나 수정한다(주당 분배금, 세전, 원).
#   - delete: true를 적으면 그 항목을 지운다.
#   - 날짜를 고칠 때는 잘못된 날짜의 삭제 항목과 맞는 날짜의 추가 항목을 둘 다 쓴다.
# - source(근거, KIND 공시 URL 등)는 모든 항목에 필수다.
# - 종목코드는 반드시 따옴표로 감싼 6자리 문자열로 쓴다.
# - 같은 (종목코드, 분배락일)을 두 번 쓰면 오류다.
# - 수집 명령의 점검 경고가 난 값이 실제로 맞으면, 같은 금액과 근거를 적어 확인했다고 남긴다.
#   이 파일로 적용한 항목은 점검하지 않으므로 경고가 꺼진다.
#
# 예:
# overrides:
#   - code: "069500"
#     ex_date: 2015-04-29
#     amount: 150
#     source: https://kind.krx.co.kr/...
#   - code: "069500"
#     ex_date: 2015-04-30
#     delete: true
#     source: https://kind.krx.co.kr/...

overrides:
  # yfinance가 1,458원을 1.458로 읽었다(천 단위 구분 기호 오인). 운용사 상품 페이지의 최근 분배 기준 값.
  - code: "196230"
    ex_date: 2025-12-12
    amount: 1458
    source: "https://www.riseetf.co.kr/prod/finderDetail/4441 (2026-11-18 조회: 실지급일 2025-12-17, 분배금액 1,458원)"
